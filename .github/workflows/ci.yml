name: Rostro CI — Build & Verification Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Universal Iraqi KYC Suite & Production Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run 55-Assertion Universal Iraqi KYC Verification Suite
        run: npm test

      - name: Run TypeScript Unit Tests (kycEngine.test.ts)
        run: node --experimental-strip-types --test src/utils/kycEngine.test.ts

      - name: Build Production React 19 + Vite Bundle
        run: npm run build
